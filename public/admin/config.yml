backend:
  name: git-gateway
  branch: main # Vérifiez si votre branche principale est 'main' ou 'master'

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  # COLLECTION 1 : Gestion des Voyages
  - name: "trips"
    label: "Nos Voyages / Séjours"
    folder: "src/content/trips"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre du voyage", name: "title", widget: "string" }
      - { label: "Identifiant unique (ID)", name: "id", widget: "string" }
      - { label: "Sous-titre / Région", name: "subtitle", widget: "string" }
      - { label: "Catégorie", name: "category", widget: "select", options: ["Désert & Dunes", "Plages & Surf", "Villes Impériales", "Nature & Randonnée"] }
      - { label: "Prix (MAD)", name: "price", widget: "number" }
      - { label: "Ancien prix (Biffé)", name: "originalPrice", widget: "number", required: false }
      - { label: "Durée", name: "duration", widget: "string" }
      - { label: "Image principale", name: "image", widget: "image" }
      - { label: "Populaire ?", name: "isPopular", widget: "boolean", default: true }
      - { label: "Note (ex: 4.9)", name: "rating", widget: "number", value_type: "float", default: 4.9 }
      - { label: "Nombre d'avis", name: "reviewsCount", widget: "number", default: 100 }
      - { label: "Points forts", name: "highlights", widget: "list" }

  # COLLECTION 2 : Galerie Instagram
  - name: "instagram_gallery"
    label: "Instants Instagram"
    folder: "src/content/instagram"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Lieu", name: "location", widget: "string" }
      - { label: "Légende", name: "caption", widget: "text" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Lien Instagram", name: "post_url", widget: "string" }
      - { label: "Likes", name: "likes", widget: "number", default: 500 }
      - { label: "Commentaires", name: "comments", widget: "number", default: 30 }
      - { label: "Ordre d'affichage", name: "order", widget: "number", default: 1 }
